name: Build and Release APK

on:
  push:
    tags: ['v*']          # مثال: git tag v0.2.0 && git push origin v0.2.0
  workflow_dispatch:       # أو شغّله يدويًا من تبويب Actions

permissions:
  contents: write          # مطلوب لإنشاء الـ Release ورفع الملف

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        continue-on-error: true   # لا يمنع البناء؛ راجع النتيجة في سجل Actions

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          NAME="promptlab-${GITHUB_REF_NAME}.apk"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || NAME="promptlab-dev-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
